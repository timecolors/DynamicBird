name: build

permissions:
  contents: write

"on":
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-test:
    name: Build + Unit Tests + Smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ShoreHue.sln

      - name: Build Debug
        run: dotnet build ShoreHue.sln -c Debug -v minimal

      - name: Unit Tests
        run: dotnet test tests/ShoreHue.Tests/ShoreHue.Tests.csproj -c Debug --no-build -v minimal

      - name: Market Packages Compile Check
        run: dotnet run --project tools/MarketValidator/MarketValidator.csproj -c Debug

      - name: Smoke Test
        shell: pwsh
        run: |
          $p = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force -Path $p | Out-Null
          dotnet build tools/SmokeTest/SmokeTest.csproj -c Debug -o $p -v minimal
          if ($LASTEXITCODE -ne 0) { Write-Error "SmokeTest build failed"; exit 1 }
          $proc = Start-Process -FilePath (Join-Path $p "SmokeTest.exe") -WorkingDirectory $p -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          $result = $null
          while ((Get-Date) -lt $deadline -and -not $proc.HasExited) {
            Start-Sleep -Seconds 2
            if (Test-Path (Join-Path $p "smoke-result.txt")) { $result = Get-Content (Join-Path $p "smoke-result.txt") -ErrorAction SilentlyContinue; break }
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force; Write-Error "SmokeTest timed out (60s), no result" }
          elseif (-not $result) { $result = Get-Content (Join-Path $p "smoke-result.txt") -ErrorAction SilentlyContinue }
          if (-not $result -or -not $result.StartsWith("SMOKE OK")) {
            Write-Error "Smoke test failed: exit=$($proc.ExitCode) result=$result"
          } else {
            Write-Output $result
          }

  publish:
    name: Publish win-x64 (single-file)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish ShoreHue.csproj -c Release -p:PublishProfile=win-x64 -v minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShoreHue-win-x64
          path: bin/publish/win-x64/ShoreHue.exe

  msix:
    name: Package MSIX (unsigned)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish ShoreHue.csproj -c Release -p:PublishProfile=win-x64 -v minimal

      - name: Build MSIX
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          ./packaging/build-msix.ps1 -Version "$ver.0" -PublisherCN "CN=FAFCE538-611A-4FA6-9046-8E37F31B8034"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShoreHue-msix
          path: packaging/Output/*.msix

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, msix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ShoreHue-win-x64
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: ShoreHue-msix
          path: release-msix

      - name: Assemble
        shell: bash
        run: |
          mkdir -p final
          cp release/ShoreHue.exe final/ShoreHue.exe
          cp release-msix/*.msix final/ 2>/dev/null || true

      # Release body from RELEASE-NOTES.md (avoid commit message dev details)
      - name: Extract release body
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          awk -v tag="$tag" '$0 ~ "^## " tag { insec=1; next } insec && /^## / { exit } insec { print }' docs/RELEASE-NOTES.md > release-body.md
          echo "body_path=$GITHUB_WORKSPACE/release-body.md" >> "$GITHUB_ENV"

      - name: Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ShoreHue ${{ github.ref_name }}
          body_path: ${{ env.body_path }}
          draft: true
          files: final/*
